# Quarterly Super Investors + 1% Club SHP ingest, then rebuild and deploy.
#
# SEBI requires SHP within 21 days of quarter-end; inferLatestQuarter() waits +25 days.
# Schedule: 6 AM IST on the 28th of Jan/Apr/Jul/Oct (post-SHP filing window).
# Manual: Actions -> Pipeline Quarterly Super Investors.

name: Pipeline Quarterly Super Investors

on:
  schedule:
    # 00:30 UTC = 06:00 IST — 28th of Jan, Apr, Jul, Oct
    - cron: '30 0 28 1,4,7,10 *'

  workflow_dispatch:
    inputs:
      missing_only:
        description: Re-fetch only stocks missing SHP for latest quarter
        type: boolean
        default: false
      skip_deploy:
        description: Refresh Neon/JSON only (no build/deploy)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ipofins-production
  cancel-in-progress: false

jobs:
  quarterly-si-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - uses: browser-actions/setup-chrome@v1

      - run: npm ci

      - name: Verify Neon schema
        run: npm run db:verify
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Run quarterly SI cron (SHP + signals + export)
        run: |
          EXTRA=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.missing_only }}" = "true" ]; then
            EXTRA="--missing-only"
          fi
          npm run pipeline:cron:quarterly -- $EXTRA
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Type check
        if: github.event_name != 'workflow_dispatch' || inputs.skip_deploy != true
        run: npm run check

      - uses: actions/cache@v5
        if: github.event_name != 'workflow_dispatch' || inputs.skip_deploy != true
        id: export-cache
        with:
          path: public/data
          key: export-data-${{ hashFiles('package-lock.json', 'scripts/export-client-data.mjs', 'scripts/lib/**', 'scripts/run-export-if-needed.mjs') }}
          restore-keys: |
            export-data-

      - name: Build static site
        if: github.event_name != 'workflow_dispatch' || inputs.skip_deploy != true
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FORCE_EXPORT: '1'

      - uses: actions/cache/save@v5
        if: success() && (github.event_name != 'workflow_dispatch' || inputs.skip_deploy != true)
        with:
          path: public/data
          key: export-data-${{ hashFiles('package-lock.json', 'scripts/export-client-data.mjs', 'scripts/lib/**', 'scripts/run-export-if-needed.mjs') }}

      - name: Deploy to Vercel
        if: github.event_name != 'workflow_dispatch' || inputs.skip_deploy != true
        run: |
          npm i -g vercel@latest
          if [ -f .vercel/output/config.json ]; then
            node scripts/write-vercel-output-config.mjs --merge
          else
            mkdir -p .vercel/output/static
            cp -r dist/* .vercel/output/static/
            node scripts/write-vercel-output-config.mjs
          fi
          vercel deploy --prebuilt --prod --yes --archive=tgz --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
