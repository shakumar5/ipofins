# Daily IPO + NAV + subscription refresh, then rebuild and deploy.
# Schedule: 9 AM IST Mon-Fri (03:30 UTC). Manual: Actions -> Pipeline Daily.

name: Pipeline Daily

on:
  schedule:
    # 03:30 UTC = 09:00 IST, Monday-Friday only
    - cron: '30 3 * * 1-5'

  workflow_dispatch:
    inputs:
      quick_ipo:
        description: Quick IPO mode (skip closed IPO detail pages — faster)
        type: boolean
        default: false
      skip_deploy:
        description: Refresh Neon only (no build/deploy)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ipofins-production
  cancel-in-progress: false

jobs:
  daily-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Verify Neon schema
        run: npm run db:verify
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Run daily cron (NAV + IPO + subscription)
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.quick_ipo }}" = "true" ]; then
            npm run pipeline:cron:daily -- --quick
          else
            npm run pipeline:cron:daily
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Type check
        if: github.event_name != 'workflow_dispatch' || inputs.skip_deploy != true
        run: npm run check

      - uses: actions/cache@v5
        if: github.event_name != 'workflow_dispatch' || inputs.skip_deploy != true
        id: export-cache
        with:
          path: public/data
          key: export-data-${{ hashFiles('package-lock.json', 'scripts/export-client-data.mjs', 'scripts/lib/**', 'scripts/run-export-if-needed.mjs') }}
          restore-keys: |
            export-data-

      - name: Build static site
        if: github.event_name != 'workflow_dispatch' || inputs.skip_deploy != true
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FORCE_EXPORT: '1'

      - uses: actions/cache/save@v5
        if: success() && (github.event_name != 'workflow_dispatch' || inputs.skip_deploy != true)
        with:
          path: public/data
          key: export-data-${{ hashFiles('package-lock.json', 'scripts/export-client-data.mjs', 'scripts/lib/**', 'scripts/run-export-if-needed.mjs') }}

      - name: Deploy to Vercel
        if: github.event_name != 'workflow_dispatch' || inputs.skip_deploy != true
        run: |
          npm i -g vercel@latest
          if [ -f .vercel/output/config.json ]; then
            node scripts/write-vercel-output-config.mjs --merge
          else
            mkdir -p .vercel/output/static
            cp -r dist/* .vercel/output/static/
            node scripts/write-vercel-output-config.mjs
          fi
          vercel deploy --prebuilt --prod --yes --archive=tgz --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
