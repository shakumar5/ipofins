# Monthly MF holdings + SAST sweep, then rebuild and deploy.
# Schedule: 6 AM IST on the 15th of every month (00:30 UTC). Manual: Actions -> Pipeline Monthly.

name: Pipeline Monthly

on:
  schedule:
    # 00:30 UTC = 06:00 IST, day 15 each month
    - cron: '30 0 15 * *'

  workflow_dispatch:
    inputs:
      full_holdings:
        description: Full holdings reload (all months — slow)
        type: boolean
        default: false
      skip_deploy:
        description: Refresh Neon/JSON only (no build/deploy)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ipofins-production
  cancel-in-progress: false

jobs:
  monthly-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - uses: browser-actions/setup-chrome@v1

      - run: npm ci

      - name: Verify Neon schema
        run: npm run db:verify
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Run monthly cron (MF holdings + SAST)
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.full_holdings }}" = "true" ]; then
            npm run pipeline:cron:monthly -- --full
          else
            npm run pipeline:cron:monthly
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Excel holdings live on the operator machine — CI refreshes from Neon.
          HOLDINGS_SKIP_IF_MISSING: '1'

      - name: Type check
        if: github.event_name != 'workflow_dispatch' || inputs.skip_deploy != true
        run: npm run check

      - uses: actions/cache@v5
        if: github.event_name != 'workflow_dispatch' || inputs.skip_deploy != true
        id: export-cache
        with:
          path: public/data
          key: export-data-${{ hashFiles('package-lock.json', 'scripts/export-client-data.mjs', 'scripts/lib/**', 'scripts/run-export-if-needed.mjs') }}
          restore-keys: |
            export-data-

      - name: Build static site
        if: github.event_name != 'workflow_dispatch' || inputs.skip_deploy != true
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FORCE_EXPORT: '1'

      - name: Validate MF holdings quality
        if: github.event_name != 'workflow_dispatch' || inputs.skip_deploy != true
        run: npm run validate:mf-holdings-quality
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - uses: actions/cache/save@v5
        if: success() && (github.event_name != 'workflow_dispatch' || inputs.skip_deploy != true)
        with:
          path: public/data
          key: export-data-${{ hashFiles('package-lock.json', 'scripts/export-client-data.mjs', 'scripts/lib/**', 'scripts/run-export-if-needed.mjs') }}

      - name: Deploy to Vercel
        if: github.event_name != 'workflow_dispatch' || inputs.skip_deploy != true
        run: |
          npm i -g vercel@latest
          if [ -f .vercel/output/config.json ]; then
            node scripts/write-vercel-output-config.mjs --merge
          else
            mkdir -p .vercel/output/static
            cp -r dist/* .vercel/output/static/
            node scripts/write-vercel-output-config.mjs
          fi
          vercel deploy --prebuilt --prod --yes --archive=tgz --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
