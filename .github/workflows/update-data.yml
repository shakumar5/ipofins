# IPOfins — Automated Data Refresh & Deploy
# Runs every 12 hours. Fetches live data, builds, deploys to Vercel.

name: Auto Refresh & Deploy

on:
  schedule:
    # Every 12 hours: 00:30, 12:30 UTC = 06:00, 18:00 IST
    - cron: '30 0,12 * * *'
  
  workflow_dispatch:

  push:
    branches: [main]

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install dependencies
        run: npm install --legacy-peer-deps

      - name: 🔄 Fetch live data from public sources
        run: npm run fetch-data

      - name: 🏗️ Build static site
        run: npm run build

      - name: 🚀 Deploy to Vercel
        run: |
          npm i -g vercel@latest
          vercel --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
