# IPOfins — Build & Deploy
# Runs on push to main OR every 12 hours.
# Data is managed manually (AMFI Excel + Zerodha local fetch).
# This workflow only builds and deploys.

name: Build & Deploy

on:
  schedule:
    # Every 12 hours: 00:30, 12:30 UTC = 06:00, 18:00 IST
    - cron: '30 0,12 * * *'
  
  workflow_dispatch:

  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 📡 Fetch latest data (MF only - IPO data pushed from local)
        run: node scripts/fetch-all-data.mjs --mf-only
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}

      - name: 🏗️ Build static site
        run: npx astro build

      - name: 🚀 Deploy to Vercel
        run: |
          npm i -g vercel@latest
          vercel --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
