# IPOfins — Automated Build & Deploy
# Runs every 12 hours OR on push to main.
# IPO data is fetched locally (Zerodha needs browser cookies).
# GitHub Actions only fetches Mutual Fund data (AMFI — no auth needed).

name: Auto Refresh & Deploy

on:
  schedule:
    # Every 12 hours: 00:30, 12:30 UTC = 06:00, 18:00 IST
    - cron: '30 0,12 * * *'
  
  workflow_dispatch:

  push:
    branches: [main]

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install dependencies
        run: npm install --legacy-peer-deps

      - name: 🔄 Fetch mutual fund data (AMFI only)
        run: node scripts/fetch-all-data.mjs --mf-only
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: '0'

      - name: 💾 Commit data changes (if any)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/mutual-funds.json
          git diff --cached --quiet || git commit -m "chore: auto-update MF data [$(date +%Y-%m-%d)]"
          git push || true

      - name: 🏗️ Build static site
        run: npx astro build

      - name: 🚀 Deploy to Vercel
        run: |
          npm i -g vercel@latest
          vercel --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
