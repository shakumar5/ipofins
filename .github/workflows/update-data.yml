# IPOfins — Build & Deploy
# Triggers on push to main only. No scheduled data fetching.
# Data pipelines run manually locally (see DATA_PIPELINE.md).

name: Build & Deploy

on:
  push:
    branches: [main]

  workflow_dispatch:
    inputs:
      force_export:
        description: Force full Neon export (use after pipeline:monthly or data changes)
        type: boolean
        default: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Neon schema
        run: npm run db:verify
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Type check
        run: npm run check

      - name: Restore exported client data cache
        uses: actions/cache@v4
        id: export-cache
        with:
          path: public/data
          key: export-data-${{ hashFiles('package-lock.json', 'scripts/export-client-data.mjs', 'scripts/lib/**', 'scripts/run-export-if-needed.mjs') }}
          restore-keys: |
            export-data-

      - name: Export cache status
        run: |
          if [ "${{ steps.export-cache.outputs.cache-hit }}" = "true" ]; then
            echo "✓ Export cache hit — build will skip Neon export if stamp is fresh"
          else
            echo "ℹ Export cache miss — first build will run one full export, then cache for later deploys"
          fi

      - name: Build static site
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EXPORT_MAX_AGE_MINUTES: 10080
          FORCE_EXPORT: ${{ github.event_name == 'workflow_dispatch' && inputs.force_export && '1' || '' }}

      - name: Save exported client data cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: public/data
          key: export-data-${{ hashFiles('package-lock.json', 'scripts/export-client-data.mjs', 'scripts/lib/**', 'scripts/run-export-if-needed.mjs') }}

      - name: Deploy prebuilt static site to Vercel
        run: |
          npm i -g vercel@latest
          mkdir -p .vercel/output/static
          cp -r dist/* .vercel/output/static/
          cat > .vercel/output/config.json <<'EOF'
          {
            "version": 3,
            "routes": [
              {
                "src": "/mutual-funds/portfolio-overlap-checker/([^/]+-vs-[^/]+)/?",
                "dest": "/mutual-funds/portfolio-overlap-checker/index.html"
              },
              { "handle": "filesystem" }
            ]
          }
          EOF
          vercel deploy --prebuilt --prod --yes --archive=tgz --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
