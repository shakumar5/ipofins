# IPOfins — Build & Deploy
# Triggers on push to main. Scheduled data pipelines: pipeline-daily/monthly/quarterly workflows.

name: Build & Deploy

on:
  push:
    branches: [main]

  workflow_dispatch:
    inputs:
      force_export:
        description: Force full Neon export (use after pipeline:monthly or data changes)
        type: boolean
        default: false
      run_data_pipelines:
        description: Run NAV + IPO + subscription pipelines before build (one-shot data refresh)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ipofins-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore exported client data cache
        uses: actions/cache@v5
        id: export-cache
        with:
          path: public/data
          key: export-data-${{ hashFiles('package-lock.json', 'scripts/export-client-data.mjs', 'scripts/lib/**', 'scripts/run-export-if-needed.mjs') }}
          restore-keys: |
            export-data-

      - name: Export cache status
        run: |
          if [ "${{ steps.export-cache.outputs.cache-hit }}" = "true" ]; then
            echo "✓ Export cache hit — build will skip Neon export if stamp is fresh"
          else
            echo "ℹ Export cache miss — first build will run one full export, then cache for later deploys"
          fi

      - name: Verify Neon schema
        run: npm run db:verify
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Type check
        run: npm run check

      - name: Run pre-deploy data pipelines (NAV + IPO + subscription)
        if: github.event_name == 'workflow_dispatch' && inputs.run_data_pipelines
        run: npm run pipeline:predeploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Build static site
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EXPORT_MAX_AGE_MINUTES: 10080
          FORCE_EXPORT: ${{ (github.event_name == 'workflow_dispatch' && (inputs.force_export || inputs.run_data_pipelines)) && '1' || '' }}

      - name: Save exported client data cache
        if: success()
        uses: actions/cache/save@v5
        with:
          path: public/data
          key: export-data-${{ hashFiles('package-lock.json', 'scripts/export-client-data.mjs', 'scripts/lib/**', 'scripts/run-export-if-needed.mjs') }}

      - name: Deploy prebuilt static site to Vercel
        run: |
          npm i -g vercel@latest
          mkdir -p .vercel/output/static
          cp -r dist/* .vercel/output/static/
          node scripts/write-vercel-output-config.mjs
          vercel deploy --prebuilt --prod --yes --archive=tgz --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
