# FinverseUI — Automated Data Refresh & Deploy
# 
# Runs every 6 hours. Fetches live data from public sources:
# - IPO data from public listing sites
# - Mutual Fund NAVs from AMFI India (official free API)
# - Broker/Tools/Articles integrity check
#
# Then builds the static site and deploys to Vercel.
# ZERO manual intervention. No API keys needed for data fetching.

name: Auto Refresh & Deploy

on:
  schedule:
    # Every 12 hours: 00:30, 12:30 UTC = 06:00, 18:00 IST
    - cron: '30 0,12 * * *'
  
  # Manual trigger (for urgent updates)
  workflow_dispatch:

  # Also on push to main (code changes)
  push:
    branches: [main]

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔄 Fetch live data from public sources
        run: npm run fetch-data

      - name: 🏗️ Build static site
        run: npm run build

      - name: 🚀 Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'

      - name: 📊 Build summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- 📅 Built at: $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- 📄 Pages: $(find dist -name '*.html' | wc -l)" >> $GITHUB_STEP_SUMMARY
          echo "- 📊 Data files:" >> $GITHUB_STEP_SUMMARY
          echo "  - IPOs: $(cat src/data/ipos.json | python3 -c 'import json,sys;print(len(json.load(sys.stdin)))') records" >> $GITHUB_STEP_SUMMARY
          echo "  - Mutual Funds: $(cat src/data/mutual-funds.json | python3 -c 'import json,sys;print(len(json.load(sys.stdin)))') records" >> $GITHUB_STEP_SUMMARY
          echo "  - Brokers: $(cat src/data/brokers.json | python3 -c 'import json,sys;print(len(json.load(sys.stdin)))') records" >> $GITHUB_STEP_SUMMARY
