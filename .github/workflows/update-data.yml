# IPOfins — Build & Deploy
# Triggers on push to main. Scheduled data pipelines: pipeline-daily/monthly/quarterly workflows.

name: Build & Deploy

on:
  push:
    branches: [main]

  workflow_dispatch:
    inputs:
      force_export:
        description: Force full Neon export (use after pipeline:monthly or data changes)
        type: boolean
        default: false
      run_data_pipelines:
        description: Run NAV + IPO + subscription pipelines before build (one-shot data refresh)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ipofins-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore exported client data cache
        uses: actions/cache@v5
        id: export-cache
        with:
          path: public/data
          # v3: clear by-slug on DB force + always overwrite alias twins (uncoded cache orphans)
          # v4: invalidate stale by-slug cache after ICICI/Mahindra/Mirae Neon seeds
          key: export-data-v4-${{ hashFiles('package-lock.json', 'scripts/export-client-data.mjs', 'scripts/lib/**', 'scripts/run-export-if-needed.mjs', 'scripts/lib/dist-data-sync.mjs', 'scripts/ensure-dist-data.mjs', 'scripts/validate-export-cache.mjs') }}
          restore-keys: |
            export-data-v4-

      - name: Export cache status
        run: |
          if [ "${{ steps.export-cache.outputs.cache-hit }}" = "true" ]; then
            echo "✓ Export cache hit — build will skip Neon export if stamp is fresh"
          else
            echo "ℹ Export cache miss — first build will run one full export, then cache for later deploys"
          fi

      - name: Verify Neon schema
        run: npm run db:verify
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Type check
        run: npm run check

      - name: Validate export cache (force refresh if incomplete)
        run: |
          if ! node scripts/validate-export-cache.mjs; then
            echo "ℹ Forcing full Neon export — cache missing smart-money payloads"
            FORCE_EXPORT=1 node scripts/run-export-if-needed.mjs
            node scripts/validate-export-cache.mjs
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Run pre-deploy data pipelines (NAV + IPO + subscription)
        if: github.event_name == 'workflow_dispatch' && inputs.run_data_pipelines
        run: npm run pipeline:predeploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Build static site
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Always refresh holdings from Neon on prod deploys — 180m skip left ICICI/Mahindra No Data.
          EXPORT_MAX_AGE_MINUTES: '0'
          FORCE_DIST_DATA_SYNC: '1'
          FORCE_EXPORT: '1'
          EXPORT_HOLDINGS: 'db'

      - name: Save exported client data cache
        if: success()
        uses: actions/cache/save@v5
        with:
          path: public/data
          key: export-data-v4-${{ hashFiles('package-lock.json', 'scripts/export-client-data.mjs', 'scripts/lib/**', 'scripts/run-export-if-needed.mjs', 'scripts/lib/dist-data-sync.mjs', 'scripts/ensure-dist-data.mjs', 'scripts/validate-export-cache.mjs') }}

      - name: Deploy prebuilt static site to Vercel
        run: |
          npm i -g vercel@latest
          node scripts/ensure-dist-data.mjs
          if [ -f .vercel/output/config.json ]; then
            node scripts/write-vercel-output-config.mjs --merge
          else
            mkdir -p .vercel/output/static
            cp -r dist/* .vercel/output/static/
            node scripts/write-vercel-output-config.mjs
          fi
          vercel deploy --prebuilt --prod --yes --archive=tgz --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
